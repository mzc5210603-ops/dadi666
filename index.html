<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="https://pl31244383.profitableratecpmnetwork.com/26/5b/7f/265b7f219787fbb599243cc7edd19a38.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌游棋类推荐站</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="logo">🎲 桌游吧</span>
        <h1 class="site-title">桌游棋类推荐站</h1>
      </div>
      <div class="header-actions">
        <input type="search" id="searchInput" class="search-box" placeholder="搜索桌游、策略、聚会、棋类...">
        <button id="themeToggle" class="theme-btn" title="切换明暗主题">🌙</button>
      </div>
    </div>
    <nav class="category-nav container">
      <div class="cat-scroll">
        <button class="cat-btn active" data-cat="全部">全部</button><button class="cat-btn " data-cat="策略桌游">策略桌游</button><button class="cat-btn " data-cat="派对桌游">派对桌游</button><button class="cat-btn " data-cat="家庭桌游">家庭桌游</button><button class="cat-btn " data-cat="双人桌游">双人桌游</button><button class="cat-btn " data-cat="儿童桌游">儿童桌游</button><button class="cat-btn " data-cat="棋类经典">棋类经典</button>
      </div>
      <div class="header-stats" id="headerStats">共 <b id="totalCount">0</b> 条 · 最后更新 <span id="lastUpdate">-</span></div>
    </nav>
  </header>

  <main class="container main-area">
    <section id="cardGrid" class="card-grid">
      <!-- 动态渲染 -->
    </section>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">没有找到相关内容</div>
      <div class="empty-desc">试试换个关键词或切换其他分类</div>
    </div>
  </main>

  <!-- 详情弹窗 -->
  <div id="detailModal" class="modal" style="display:none">
    <div class="modal-mask" onclick="closeModal()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./js/app.js"></script>
  <script src="https://pl31244384.profitableratecpmnetwork.com/ce/00/12/ce00123d95b81d91770b0c4c5d15a716.js"></script>

</body>
</html>
